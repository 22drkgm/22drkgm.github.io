<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 140" width="364" height="140">
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a28"/><stop offset=".55" stop-color="#4a4640"/><stop offset="1" stop-color="#1e1d1b"/></linearGradient>
    <radialGradient id="glow" cx=".12" cy=".45" r=".5"><stop offset="0" stop-color="#e07a2e" stop-opacity=".75"/><stop offset="1" stop-color="#e07a2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="dep" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity="1"/><stop offset=".8" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="b"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="364" height="140" fill="url(#bench)"/>
  <rect width="364" height="140" fill="url(#glow)"/>
  <!-- quartz filters, increasing PM loading left to right -->
  <g transform="translate(0,4)">
    <g><ellipse cx="52" cy="84" rx="30" ry="12" fill="#000" opacity=".35" filter="url(#b)"/><ellipse cx="52" cy="78" rx="30" ry="12" fill="#f3f1ec"/><ellipse cx="52" cy="78" rx="24" ry="9.5" fill="url(#dep)" opacity=".06"/></g>
    <g><ellipse cx="116" cy="84" rx="30" ry="12" fill="#000" opacity=".35" filter="url(#b)"/><ellipse cx="116" cy="78" rx="30" ry="12" fill="#f3f1ec"/><ellipse cx="116" cy="78" rx="24" ry="9.5" fill="url(#dep)" opacity=".2"/></g>
    <g><ellipse cx="180" cy="84" rx="30" ry="12" fill="#000" opacity=".35" filter="url(#b)"/><ellipse cx="180" cy="78" rx="30" ry="12" fill="#f3f1ec"/><ellipse cx="180" cy="78" rx="24" ry="9.5" fill="url(#dep)" opacity=".38"/></g>
    <g><ellipse cx="244" cy="84" rx="30" ry="12" fill="#000" opacity=".35" filter="url(#b)"/><ellipse cx="244" cy="78" rx="30" ry="12" fill="#f3f1ec"/><ellipse cx="244" cy="78" rx="24" ry="9.5" fill="url(#dep)" opacity=".58"/></g>
    <g><ellipse cx="308" cy="84" rx="30" ry="12" fill="#000" opacity=".35" filter="url(#b)"/><ellipse cx="308" cy="78" rx="30" ry="12" fill="#f3f1ec"/><ellipse cx="308" cy="78" rx="24" ry="9.5" fill="url(#dep)" opacity=".8"/></g>
  </g>
