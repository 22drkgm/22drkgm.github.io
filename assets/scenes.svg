<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 391" width="244" height="391">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8fb3"/><stop offset="1" stop-color="#c8d4df"/></linearGradient>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e9aa3"/><stop offset=".7" stop-color="#c4c8c9"/><stop offset="1" stop-color="#9da19c"/></linearGradient>
    <radialGradient id="sun" cx=".55" cy=".45" r=".7"><stop offset="0" stop-color="#fff6c8"/><stop offset=".25" stop-color="#e9c46a"/><stop offset=".7" stop-color="#b48a3c"/><stop offset="1" stop-color="#6e5427"/></radialGradient>
    <clipPath id="cA"><rect x="0" y="0" width="144" height="146"/></clipPath>
    <clipPath id="cB"><rect x="82" y="96" width="156" height="156"/></clipPath>
    <clipPath id="cC"><rect x="0" y="236" width="174" height="146"/></clipPath>
  </defs>

  <!-- A: plume rising into cloud -->
  <g filter="url(#sh)"><rect x="0" y="0" width="144" height="146" fill="url(#skyA)"/></g>
  <g clip-path="url(#cA)">
    <g fill="#f4f6f8" filter="url(#b4)">
      <circle cx="40" cy="40" r="26"/><circle cx="72" cy="30" r="30"/><circle cx="105" cy="46" r="24"/>
      <circle cx="60" cy="62" r="24"/><circle cx="92" cy="70" r="22"/><circle cx="20" cy="70" r="18"/>
    </g>
    <g fill="#e6e9ec" filter="url(#b2)">
      <ellipse cx="96" cy="110" rx="14" ry="18"/><ellipse cx="88" cy="92" rx="18" ry="16"/>
    </g>
    <rect x="98" y="118" width="7" height="30" fill="#4b5560"/>
  </g>

  <!-- C: golden hazy sun over industrial skyline (drawn before B so B overlaps) -->
  <g filter="url(#sh)"><rect x="0" y="236" width="174" height="146" fill="url(#sun)"/></g>
  <g clip-path="url(#cC)">
    <rect x="0" y="236" width="174" height="146" fill="#d8b766" opacity=".25" filter="url(#b4)"/>
    <g fill="#4a3c22" opacity=".85">
      <rect x="18" y="330" width="6" height="52"/><rect x="30" y="342" width="5" height="40"/>
      <path d="M48 382 V352 H70 V340 H86 V382Z"/>
      <rect x="96" y="320" width="7" height="62"/>
      <path d="M118 382 Q124 350 119 330 L150 330 Q145 350 151 382Z"/>
      <rect x="0" y="366" width="174" height="16"/>
    </g>
    <g fill="#f1e2b0" opacity=".55" filter="url(#b4)">
      <ellipse cx="22" cy="316" rx="10" ry="14"/><ellipse cx="100" cy="304" rx="12" ry="16"/>
    </g>
  </g>

  <!-- B: misty dawn, tree line and colliery headframe -->
  <g filter="url(#sh)"><rect x="82" y="96" width="156" height="156" fill="url(#skyB)"/></g>
  <g clip-path="url(#cB)">
    <path d="M82 200 Q120 186 160 194 T238 188 V252 H82Z" fill="#7a807c" opacity=".55" filter="url(#b2)"/>
    <g fill="#3f4542" opacity=".75">
      <path d="M150 228 L162 160 L170 160 L182 228Z" fill="none" stroke="#3f4542" stroke-width="3"/>
      <path d="M155 200 H178 M158 182 H174" stroke="#3f4542" stroke-width="2"/>
      <circle cx="166" cy="156" r="7"/>
    </g>
    <path d="M82 252 V214 L88 228 L94 204 L100 230 L108 198 L116 232 L124 210 L132 236 L140 214 L150 240 L196 236 L204 216 L212 238 L220 210 L228 236 L238 220 V252Z" fill="#2f3532"/>
    <rect x="82" y="190" width="156" height="30" fill="#d4d7d6" opacity=".45" filter="url(#b4)"/>
  </g>
</svg>
