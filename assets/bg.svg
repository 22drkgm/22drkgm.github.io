<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f0"/>
      <stop offset="0.6" stop-color="#ececea"/>
      <stop offset="1" stop-color="#dcdcd8"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0f0f0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- far hills -->
  <path d="M0 820 Q200 760 420 790 T860 770 T1300 785 T1600 760 V1000 H0Z" fill="#b9bab5" opacity=".22" filter="url(#softer)"/>

  <!-- distant industry: chimneys, cooling tower, colliery headframe -->
  <g fill="#9c9d97" opacity=".16" filter="url(#soft)">
    <rect x="1010" y="640" width="16" height="200"/>
    <rect x="1048" y="670" width="13" height="170"/>
    <path d="M1120 840 Q1132 760 1122 700 L1196 700 Q1186 760 1198 840Z"/>
    <path d="M1300 840 L1318 700 L1330 700 L1348 840Z M1306 760 H1342 M1312 720 H1336" stroke="#9c9d97" stroke-width="4"/>
    <circle cx="1324" cy="696" r="12"/>
  </g>
  <!-- smoke plumes -->
  <g fill="#c9c9c5" opacity=".25" filter="url(#softer)">
    <ellipse cx="1030" cy="600" rx="40" ry="26"/>
    <ellipse cx="1080" cy="560" rx="70" ry="34"/>
    <ellipse cx="1160" cy="530" rx="110" ry="40"/>
  </g>

  <!-- near tree line, left -->
  <g fill="#7f8079" opacity=".17" filter="url(#soft)">
    <path d="M0 1000 V700 L18 760 L30 640 L44 760 L58 600 L74 770 L88 660 L104 780 L120 610 L138 790 L154 690 L170 800 L186 650 L204 820 L222 720 L240 840 L262 760 L284 870 L310 820 L340 900 V1000Z"/>
  </g>

  <!-- grass foreground -->
  <g stroke="#8a8a82" stroke-width="2" opacity=".18" fill="none" filter="url(#soft)">
    <path d="M380 1000 Q390 930 372 880 M420 1000 Q430 920 446 870 M470 1000 Q462 940 480 900 M900 1000 Q912 930 896 890 M950 1000 Q956 940 978 905 M1400 1000 Q1390 930 1410 880 M1460 1000 Q1470 940 1452 900 M1520 1000 Q1530 930 1550 890"/>
  </g>
  <rect y="700" width="1600" height="300" fill="url(#fog)"/>
</svg>
